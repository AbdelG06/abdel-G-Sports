<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="abdel-G-Sports, une experience web moderne pour football, basketball et F1."
    />
    <title>abdel-G-Sports</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="Navigation principale">
      <a class="brand" href="./index.html" aria-label="abdel-G-Sports accueil">
        <span class="brand-mark">AG</span>
        <span>abdel-G-Sports</span>
      </a>
      <nav class="nav-links" aria-label="Sections">
        <a href="./football.html">Football</a>
        <a href="./basketball.html">Basketball</a>
        <a href="./f1.html">F1</a>
      </nav>
    </header>

    <main>
      <section class="hero" id="sports">
        <div class="hero-copy">
          <p class="eyebrow">Sports hub</p>
          <h1>Choisis ton sport</h1>
          <p class="hero-text">
            Football, basketball et bientot F1 dans une navigation propre avec
            une page pour chaque sport.
          </p>
        </div>

        <div class="sport-grid" aria-label="Choix du sport">
          <a class="sport-card football-card" href="./football.html">
            <span class="sport-logo-box channel-badge">SPORT</span>
            <span class="sport-card-copy">
              <strong>Football</strong>
              <small>Channel sport 1 a 5</small>
            </span>
          </a>

          <a class="sport-card basketball-card" href="./basketball.html">
            <span class="sport-logo-box">
              <img src="./National_Basketball_Association_logo.svg.png" alt="Logo NBA" />
            </span>
            <span class="sport-card-copy">
              <strong>Basketball</strong>
              <small>NBA match en direct</small>
            </span>
          </a>
        </div>

        <a class="coming-soon" href="./f1.html" aria-label="F1 coming soon">
          <img src="./F1.svg.webp" alt="Logo F1" />
          <div>
            <span>F1</span>
            <strong>Coming soon</strong>
          </div>
        </a>
      </section>
    </main>

    <footer class="site-footer">
      <span>abdel-G-Sports</span>
      <span>Football + Basketball + F1 soon</span>
    </footer>
  </body>
</html>
