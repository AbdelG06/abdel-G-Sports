<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="F1 abdel-G-Sports, section live avec stream integre."
    />
    <title>F1 Live - abdel-G-Sports</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="Navigation principale">
      <a class="brand" href="./index.html" aria-label="Retour accueil">
        <span class="brand-mark">AG</span>
        <span>abdel-G-Sports</span>
      </a>
      <nav class="nav-links" aria-label="Pages sport">

        <a href="./football.html">Football</a>
        <a href="./basketball.html">Basketball</a>

    <main>
      <section class="panel-section page-panel channel-page-shell" aria-label="F1 live">
        <div class="section-heading">
          <div>
            <p class="eyebrow">F1</p>
            <h1 class="channel-title">Live section</h1>
          </div>
          <img class="section-logo" src="./F1.svg.webp" alt="Logo F1" />

          <iframe

            align="center"
            height="450px"
            width="100%"
            title="F1 live stream"
          ></iframe>
        </div>

    <footer class="site-footer">
      <span>abdel-G-Sports</span>
      <span>F1 live</span>
