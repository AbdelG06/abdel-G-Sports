<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="abdel-G-Sports football, selection de channel sport."
    />
    <title>Football - abdel-G-Sports</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header" aria-label="Navigation principale">
      <a class="brand" href="./index.html" aria-label="Retour accueil">
        <span class="brand-mark">AG</span>
        <span>abdel-G-Sports</span>
      </a>
      <nav class="nav-links" aria-label="Pages sport">
        <a href="./index.html">Accueil</a>
        <a href="./basketball.html">Basketball</a>
        <a href="./f1.html">F1</a>
      </nav>
    </header>

    <main>
      <section class="panel-section page-panel channel-page-shell" aria-label="Football">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Football</p>
            <h1 class="channel-title">Channel Sport</h1>
          </div>
          <div class="channel-meta">Choisis une chaine pour ouvrir sa page video</div>
        </div>

        <div class="channel-grid" aria-label="Liste des chaines">
          <a class="channel-card football-card" href="./channel-arryadia.html">
            <img src="./src/Logo-arryadia.png" alt="Logo Arryadia" />
            <div>
              <strong>Channel Sport 1</strong>
              <span>Arryadia</span>
            </div>
          </a>

          <a class="channel-card football-card" href="./channel-bein-news.html">
            <img src="./src/bein-sports-news.jpg" alt="Logo beIN News" />
            <div>
              <strong>Channel Sport 2</strong>
              <span>beIN News</span>
            </div>
          </a>

          <a class="channel-card football-card" href="./channel-bein-hd.html">
            <img src="./src/hd-bein-sports-hd-logo.png" alt="Logo beIN HD" />
            <div>
              <strong>Channel Sport 3</strong>
              <span>beIN HD</span>
            </div>
          </a>

          <a class="channel-card football-card" href="./channel-tf1.html">
            <img src="./src/TF1_logo.png" alt="Logo TF1" />
            <div>
              <strong>Channel Sport 4</strong>
              <span>TF1</span>
            </div>
          </a>

          <a class="channel-card football-card" href="./channel-m6.html">
            <img src="./src/m6 logo.png" alt="Logo M6" />
            <div>
              <strong>Channel Sport 5</strong>
              <span>M6</span>
            </div>
          </a>

          <a class="channel-card football-card" href="./channel-al-aoula.html">
            <img src="./src/al-aoula-logo.svg" alt="Logo Al Aoula" />
            <div>
              <strong>Channel Sport 6</strong>
              <span>Al Aoula</span>
            </div>
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>abdel-G-Sports</span>
      <span>Football channels</span>
    </footer>
